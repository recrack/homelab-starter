name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-plist:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell syntax
        run: |
          find . -name '*.sh' -o -path './bin/homelab' -o -path './cmd/brew-homelab' |
            while IFS= read -r file; do zsh -n "$file"; done
      - name: Check plist syntax
        run: |
          find modules -name '*.plist' -print0 |
            xargs -0 -n1 plutil -lint
